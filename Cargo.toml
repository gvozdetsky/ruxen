[package]
name = "ruxen"
version = "0.1.2"
edition = "2024"
# Let-chains (`if let … && let …`) need 1.88; CI checks it (job `msrv`).
rust-version = "1.88"
license = "Apache-2.0"
description = "Experimental nginx-compatible HTTP server and reverse proxy for Linux, written in Rust on io_uring"
repository = "https://github.com/gvozdetsky/ruxen"
readme = "README.md"
keywords = ["nginx", "http", "web-server", "io-uring", "reverse-proxy"]
categories = ["web-programming::http-server", "network-programming", "command-line-utilities"]
authors = ["Eugene Gvozdetsky <gvozdet@gmail.com>"]
# The crate is a server binary: ship the sources and docs `cargo install`
# needs, not the benches, integration tests or CI files.
include = [
    "/src/**",
    "/examples/*.conf",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/DESIGN.md",
    "/LICENSE",
]

[dependencies]
bytes = "1"
libc = "0.2"
monoio = "0.2.4"
regex = "1"
socket2 = "0.5"
rustls = "0.23"
rustls-pemfile = "2"

# musl's allocator is slow on the per-request proxy and TLS paths (#199);
# the glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
rcgen = "0.14"
