[package]
name = "ruxen"
version = "0.2.3"
edition = "2024"
# Let-chains (`if let … && let …`) need 1.88; CI checks it (job `msrv`).
rust-version = "1.88"
license = "Apache-2.0"
description = "Experimental nginx-compatible HTTP server and reverse proxy for Linux, written in Rust on io_uring"
repository = "https://github.com/gvozdetsky/ruxen"
readme = "README.md"
keywords = ["nginx", "http", "web-server", "io-uring", "reverse-proxy"]
categories = ["web-programming::http-server", "network-programming", "command-line-utilities"]
authors = ["Eugene Gvozdetsky <gvozdet@gmail.com>"]
# The crate is a server binary: ship the sources and docs `cargo install`
# needs, not the benches, integration tests or CI files.
include = [
    "/src/**",
    "/examples/*.conf",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/DESIGN.md",
    "/LICENSE",
    "/NOTICE",
]

[features]
# Builds the library view of the sources (src/lib.rs) for the fuzz targets
# in fuzz/ (#217). Off in every normal build, where the library is empty.
fuzzing = []

[dependencies]
bytes = "1"
# The ring setup flags monoio's `RuntimeBuilder::uring_builder` takes;
# the same version as monoio's.
io-uring = "0.6"
libc = "0.2"
monoio = "0.2.4"
regex = "1"
# Line scans of a request's head (the proxied body framing); already in
# the tree through regex.
memchr = "2"
# gzip filter (#93): pure Rust, no C dependency, like rustls. Used directly
# (not through flate2) to size memLevel with the window, as nginx does.
zlib-rs = { version = "0.6", default-features = false, features = ["std", "rust-allocator"] }
socket2 = "0.5"
# `zlib`: certificate compression (RFC 8879) for `ssl_certificate_compression`
# (#601), off unless a server turns it on.
rustls = { version = "0.23.46", features = ["zlib"] }
# Session tickets in nginx's layout (#140) and the proxy cache's file names
# (#233); already in the tree through
# rustls, with the features rustls turns on.
aws-lc-rs = { version = "1.18", default-features = false }
# proxy_ssl_verify (#117): OpenSSL's X.509 verification from the AWS-LC
# under aws-lc-rs, and webpki's signature check from a bare key; both
# already in the tree through rustls. `all-bindings` only picks the
# pregenerated bindings with the X509 API (the C library is the same).
aws-lc-sys = { version = "0.46", default-features = false, features = ["all-bindings"] }
rustls-webpki = { version = "0.103", default-features = false }
h2 = "0.4"
http = "1"
tokio = { version = "1", default-features = false }

# musl's allocator is slow on the per-request proxy and TLS paths (#199);
# the glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rcgen = "0.14"
