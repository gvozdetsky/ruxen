# TLS termination in front of static files and a proxy.
events {}
http {
    ssl_certificate     %%CERT%%;
    ssl_certificate_key %%KEY%%;
    server {
        listen 8443 ssl;
        server_name localhost;
        root html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location /p/ { proxy_pass http://backend.example:9000; proxy_set_header X-Scheme $scheme; }
        location /vars { return 200 "$scheme $https $server_port $ssl_protocol\n"; }
    }
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }
}
