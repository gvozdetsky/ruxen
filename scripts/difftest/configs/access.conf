# Access control: basic auth, allow/deny, satisfy.
events {}
http {
    server {
        listen 8080;
        server_name localhost;
        root html;
        location /auth/ { auth_basic "realm"; auth_basic_user_file htpasswd; alias html/; }
        location /deny/ { deny all; alias html/; }
        location /allow/ { allow 127.0.0.1; deny all; alias html/; }
        location /any/ {
            satisfy any;
            deny all;
            auth_basic "any";
            auth_basic_user_file htpasswd;
            alias html/;
        }
        location /authp/ { auth_basic "p"; auth_basic_user_file htpasswd; proxy_pass http://backend.example:9000; }
    }
}
