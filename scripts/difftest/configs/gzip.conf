# gzip: types, minimum length, Vary, proxied bodies.
events {}
http {
    include      %%MIME%%;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 100;
    gzip_vary on;
    gzip_proxied any;
    server {
        listen 8080;
        server_name localhost;
        root html;
        location /p/ { proxy_pass http://backend.example:9000; }
        location /http10/ { gzip_http_version 1.0; alias html/; }
        location /nogzip/ { gzip off; alias html/; }
        location /static/ { gzip_static on; alias html/static/; }
    }
}
