# Reverse proxy: URI forms, header rewriting, redirects, errors, buffering.
events {}
http {
    upstream backend { server backend.example:9000; keepalive 8; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_name localhost;
        location / { proxy_pass http://backend; }
        location /uri/ { proxy_pass http://backend/rewritten/; }
        location /nouri/ { proxy_pass http://backend.example:9000; }
        location /hdr/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
        }
        location /ka/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /hide/ {
            proxy_pass http://backend/echo-cache;
            proxy_hide_header X-Echo;
            proxy_ignore_headers Set-Cookie;
        }
        location /redir/ { proxy_pass http://backend/echo-redirect/; }
        location /status/ { proxy_pass http://backend/echo-status/; }
        location /intercept/ {
            proxy_pass http://backend/echo-status/;
            proxy_intercept_errors on;
            error_page 404 500 502 = /fallback;
        }
        location = /fallback { return 200 "fallback\n"; }
        location = /s204 { proxy_pass http://backend/echo-status/204; }
        location = /s404 { proxy_pass http://backend/echo-status/404; }
        location = /s503 { proxy_pass http://backend/echo-status/503; }
        location = /i404 {
            proxy_pass http://backend/echo-status/404;
            proxy_intercept_errors on;
            error_page 404 = /fallback;
        }
        location /chunked/ { proxy_pass http://backend/echo-chunked/; }
        location /nobuf/ { proxy_pass http://backend; proxy_buffering off; proxy_request_buffering off; }
        location /down/ { proxy_pass http://127.0.0.1:1; }
        location /var/ { set $u /varpath; proxy_pass http://backend$u; }
    }
}
