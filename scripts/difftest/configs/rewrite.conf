# rewrite, return, if, map, set and how variables escape.
events {}
http {
    map $uri $mapped { default none; ~^/m/(?<rest>.*)$ $rest; /exact exact; }
    server {
        listen 8080;
        server_name localhost;
        root html;
        rewrite ^/old/(.*)$ /new/$1 permanent;
        location /r/ { rewrite ^/r/(.*)$ /dir/$1 last; }
        location /b/ { rewrite ^ /hello.txt break; }
        location /redir/ { rewrite ^/redir/(.*)$ http://other.example/$1? redirect; }
        location /args/ { rewrite ^ /dir/?x=1; }
        location /m/ { return 200 "mapped=$mapped\n"; }
        location /vars/ {
            return 200 "uri=$uri request_uri=$request_uri args=$args is_args=$is_args arg_a=$arg_a host=$host http_host=$http_host scheme=$scheme method=$request_method proto=$server_protocol cl=$content_length ct=$content_type cookie_a=$cookie_a\n";
        }
        location /if/ {
            if ($arg_x = 1) { return 418; }
            if ($http_user_agent ~* bot) { return 403; }
            if (-f $request_filename) { return 200 "file\n"; }
            return 204;
        }
        location /set/ { set $v "a b%20c"; add_header X-V $v; return 200 "$v\n"; }
        location /r404/ { return 404; }
        location /r302/ { return 302 "http://$host/x?$args"; }
        location /r500/ { return 500 "error body\n"; }
        location /r444/ { return 444; }
        location /bad/ { return 200 "$http_x_forwarded_for|$http_cookie\n"; }
    }
}
