# Static files: index, autoindex, alias, try_files, error pages, location
# kinds, types and caching headers.
events {}
http {
    include      %%MIME%%;
    default_type application/octet-stream;
    server {
        listen 8080;
        server_name localhost;
        root html;
        index index.html;
        error_page 404 /404.html;
        location = /404.html { internal; return 404 "custom not found\n"; }
        location / { try_files $uri $uri/ =404; }
        location /noindex/ { autoindex on; }
        location /dir/ { expires 1h; add_header X-Static dir; }
        location ^~ /static/ { alias html/static/; add_header Cache-Control "public" always; }
        location ~* \.(css|js)$ { expires max; etag off; }
        location = /exact { return 200 "exact\n"; }
        location /files/ { types { application/pdf pdf; } default_type text/plain; }
        location /spa/ { try_files $uri /index.html; }
        location /limited/ { limit_except GET { deny all; } alias html/dir/; }
        location /off/ { if_modified_since off; alias html/dir/; }
        location /before/ { if_modified_since before; alias html/dir/; }
        location /maxr/ { max_ranges 1; alias html/; }
    }
}
