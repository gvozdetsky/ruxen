# Request limits and connection handling knobs.
events {}
http {
    client_max_body_size 10;
    large_client_header_buffers 2 1k;
    keepalive_requests 2;
    merge_slashes off;
    underscores_in_headers on;
    ignore_invalid_headers off;
    server {
        listen 8080;
        server_name localhost;
        root html;
        location / { }
        location /echo/ { return 200 "$request_uri|$http_x_under|$http_x_bad\n"; }
        location /p/ { proxy_pass http://backend.example:9000; }
        location /big/ { client_max_body_size 1m; proxy_pass http://backend.example:9000; }
    }
    server {
        listen 8081;
        server_name localhost;
        keepalive_timeout 0;
        chunked_transfer_encoding off;
        root html;
        location /p/ { proxy_pass http://backend.example:9000; }
    }
    server {
        listen 8082;
        server_name localhost;
        root html;
        lingering_close always;
        client_header_buffer_size 128;
        location /p/ { proxy_pass http://backend.example:9000; }
    }
}
