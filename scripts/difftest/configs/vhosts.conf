# Server selection and redirects that carry the host and port.
events {}
http {
    server {
        listen 8080 default_server;
        server_name _;
        return 200 "default $host\n";
    }
    server {
        listen 8080;
        server_name www.example.com example.com;
        location / { return 301 https://example.com$request_uri; }
        location /rel { return 302 /target; }
        location /dir { root html; }
    }
    server {
        listen 8080;
        server_name *.wild.example;
        return 200 "wild $host $server_name\n";
    }
    server {
        listen 8080;
        server_name ~^(?<sub>[a-z]+)\.re\.example$;
        return 200 "re $sub\n";
    }
    server {
        listen 8080;
        server_name noabs.example;
        absolute_redirect off;
        root html;
        location /x { return 302 /y; }
    }
    server {
        listen 8080;
        server_name inredirect.example;
        server_name_in_redirect on;
        port_in_redirect off;
        root html;
    }
    server {
        listen 8081;
        server_name localhost;
        root html;
        location / { add_header X-Port $server_port; }
    }
}
