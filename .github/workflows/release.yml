name: Release

# Push a `v*` tag to test and build the Linux binary and publish a GitHub
# release with the notes from `.github/release-notes/<tag>.md`. Run it by
# hand (workflow_dispatch) to build and upload the tarball as a workflow
# artifact without creating a release. Publishing to crates.io is a
# separate, manual `cargo publish` (see CONTRIBUTING.md, "Releasing").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Built on 22.04 so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          # Fail before building, not in the last step.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && ! -f ".github/release-notes/${tag}.md" ]]; then
            echo "missing .github/release-notes/${tag}.md" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "dist=ruxen-${tag}-x86_64-linux-gnu" >> "$GITHUB_OUTPUT"

      # The tagged commit is released as tested here, whether or not it
      # went through CI (a fix-up pushed with the tag, an amended commit).
      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          ./target/release/ruxen -V 2>&1 | grep -Fx "ruxen version: ruxen/${{ steps.version.outputs.version }}"
          for conf in examples/*.conf; do
            ./target/release/ruxen -t -c "$PWD/$conf"
          done

      - name: Package
        run: |
          dist=${{ steps.version.outputs.dist }}
          mkdir -p "$dist/examples"
          cp target/release/ruxen README.md LICENSE "$dist/"
          cp examples/*.conf "$dist/examples/"
          tar czf "$dist.tar.gz" "$dist"
          # The same tarball under a version-less name, so
          # releases/latest/download/ruxen-x86_64-linux-gnu.tar.gz (the
          # README's install link) always points at the newest release.
          cp "$dist.tar.gz" ruxen-x86_64-linux-gnu.tar.gz
          sha256sum "$dist.tar.gz" ruxen-x86_64-linux-gnu.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dist }}
          path: |
            ${{ steps.version.outputs.dist }}.tar.gz
            ruxen-x86_64-linux-gnu.tar.gz
            SHA256SUMS

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.version.outputs.tag }}
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          # Releases are immutable once published, so attach the assets to
          # a draft first and publish it as a separate step.
          gh release create "$tag" --draft "${prerelease[@]}" \
            --title "ruxen $tag" \
            --notes-file ".github/release-notes/$tag.md" \
            ${{ steps.version.outputs.dist }}.tar.gz ruxen-x86_64-linux-gnu.tar.gz SHA256SUMS
          gh release edit "$tag" --draft=false
