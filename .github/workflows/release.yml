name: Release

# Push a `v*` tag to test and build the Linux binaries and publish a GitHub
# release with the notes from `.github/release-notes/<tag>.md`. Run it by
# hand (workflow_dispatch) to build and upload the tarballs as workflow
# artifacts without creating a release. A tag also publishes the container
# image ghcr.io/gvozdetsky/ruxen (amd64 and arm64) from the same binaries,
# and, once the GitHub release is out, the crate on crates.io (#672).
#
# Supply chain (#480): each binary carries its crate list (`cargo
# auditable`), each target gets a CycloneDX SBOM as a release asset, and on
# a tag the tarballs get build-provenance and SBOM attestations signed with
# the workflow's identity (`gh attestation verify <tarball> -R
# gvozdetsky/ruxen`). The image carries buildx's provenance and an SBOM.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds on 22.04, so they run on glibc 2.35 and newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: x86_64-linux-gnu
          # Built natively on GitHub's ARM runner: no cross toolchain.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            name: aarch64-linux-gnu
          # Static: runs on any x86_64 Linux, including Alpine and glibc
          # older than 2.35.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            name: x86_64-linux-musl
            musl: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The attestations, signed through Sigstore with the run's OIDC token.
      id-token: write
      attestations: write
    env:
      # monoio uses statx, which the libc crate declares for musl only when
      # told the musl is 1.2.3+. The binary links the musl that ships with
      # Rust's musl target (newer than that) statically; musl-tools only
      # provides musl-gcc for aws-lc's C code.
      RUST_LIBC_UNSTABLE_MUSL_V1_2_3: ${{ matrix.musl && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-cyclonedx

      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          # Fail before building, not in the last step.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && ! -f ".github/release-notes/${tag}.md" ]]; then
            echo "missing .github/release-notes/${tag}.md" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "dist=ruxen-${tag}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # The tagged commit is released as tested here, whether or not it
      # went through CI (a fix-up pushed with the tag, an amended commit),
      # and on every target: CI runs on x86_64 glibc only.
      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}

      # The crate list goes into a `.dep-v0` section, for `cargo audit bin`,
      # Trivy and Syft; the code is the same as a plain build's.
      - name: Build
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/ruxen
          file "$bin"
          "$bin" -V 2>&1 | grep -Fx "ruxen version: ruxen/${{ steps.version.outputs.version }}"
          readelf -S "$bin" | grep -q '\.dep-v0'
          for conf in examples/*.conf; do
            "$bin" -t -c "$PWD/$conf"
          done

      - name: Package
        run: |
          dist=${{ steps.version.outputs.dist }}
          mkdir -p "$dist/examples"
          cp target/${{ matrix.target }}/release/ruxen README.md LICENSE "$dist/"
          cp examples/*.conf examples/mime.types "$dist/examples/"
          tar czf "$dist.tar.gz" "$dist"
          # The same tarball under a version-less name, so
          # releases/latest/download/ruxen-<target>.tar.gz (the README's
          # install links) always points at the newest release.
          cp "$dist.tar.gz" "ruxen-${{ matrix.name }}.tar.gz"

      # The dependencies this target links, normal ones only (no dev or
      # build dependencies), as CycloneDX JSON.
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target ${{ matrix.target }} --no-build-deps \
            --override-filename ruxen.cdx
          mv ruxen.cdx.json "${{ steps.version.outputs.dist }}.cdx.json"
          jq -e '.components | length > 0' "${{ steps.version.outputs.dist }}.cdx.json" > /dev/null

      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            ${{ steps.version.outputs.dist }}.tar.gz
            ruxen-${{ matrix.name }}.tar.gz

      - uses: actions/attest-sbom@v2
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            ${{ steps.version.outputs.dist }}.tar.gz
            ruxen-${{ matrix.name }}.tar.gz
          sbom-path: ${{ steps.version.outputs.dist }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.dist }}
          path: |
            ${{ steps.version.outputs.dist }}.tar.gz
            ruxen-${{ matrix.name }}.tar.gz
            ${{ steps.version.outputs.dist }}.cdx.json

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          # Releases are immutable once published, so attach the assets to
          # a draft first and publish it as a separate step.
          gh release create "$tag" --draft "${prerelease[@]}" \
            --title "ruxen $tag" \
            --notes-file ".github/release-notes/$tag.md" \
            dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS
          gh release edit "$tag" --draft=false

  image:
    # The glibc release binaries in contrib/docker/Dockerfile.release, for
    # amd64 and arm64 (Apple Silicon's Docker runs arm64). Pushed on a tag
    # only; a manual run builds and smoke-tests the amd64 image.
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Binaries
        id: bins
        run: |
          mkdir -p bin
          for pair in amd64:x86_64-linux-gnu arm64:aarch64-linux-gnu; do
            arch=${pair%%:*} name=${pair#*:}
            tar xzf "dist/ruxen-${name}.tar.gz" --wildcards --strip-components=1 \
              -C bin '*/ruxen'
            mv bin/ruxen "bin/ruxen-${arch}"
          done
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test (amd64, Docker's default seccomp profile)
        run: |
          docker buildx build -f contrib/docker/Dockerfile.release \
            --platform linux/amd64 --load -t ruxen:release .
          docker run -d --name ruxen -p 8080:8080 ruxen:release
          for i in $(seq 50); do curl -sf http://127.0.0.1:8080/ && break; sleep 0.2; done \
            | grep -q "hello from ruxen"
          docker stop ruxen
          test "$(docker inspect ruxen --format '{{.State.ExitCode}}')" = 0

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref_type == 'tag'
        run: |
          image=ghcr.io/gvozdetsky/ruxen
          tags=(-t "${image}:${{ steps.bins.outputs.version }}")
          # A pre-release (v0.2.0-rc.1) doesn't move `latest`.
          [[ "${GITHUB_REF_NAME}" != *-* ]] && tags+=(-t "${image}:latest")
          docker buildx build -f contrib/docker/Dockerfile.release \
            --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source=https://github.com/gvozdetsky/ruxen \
            --label org.opencontainers.image.version=${{ steps.bins.outputs.version }} \
            --provenance=mode=max --sbom=true \
            "${tags[@]}" --push .

  crates-io:
    # crates.io's trusted publishing (#672): a token for this run only,
    # from the workflow's OIDC identity, instead of a stored API token. The
    # crate's settings on crates.io name this repository and `release.yml`.
    # After the GitHub release, so a failed build never reaches crates.io:
    # a published version can't be replaced, only yanked.
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
