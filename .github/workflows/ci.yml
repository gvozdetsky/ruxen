name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # ruxen is Linux-only and needs io_uring; hosted Ubuntu VMs (not
    # containers) allow it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --release --all-targets --locked
      - name: Test
        run: cargo test --release --locked
      - name: Test on the epoll driver
        # monoio's legacy driver, used where io_uring is unavailable (#215).
        run: RUXEN_DRIVER=epoll cargo test --release --locked
      - name: Keep the binary for nginx-tests
        uses: actions/upload-artifact@v4
        with:
          name: ruxen-release
          path: target/release/ruxen
          retention-days: 3

  fuzz:
    # Each parser fuzz target (fuzz/, #217) for 30 s, from the seeds in
    # fuzz/seeds. Short on purpose: it catches what a change breaks. Longer
    # runs happen privately, so a crash that might be a vulnerability is
    # handled through SECURITY.md before it shows up in public logs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fuzz each target
        run: |
          for t in request host uri proxy_protocol config chunked upstream_head upstream_chunked dns_response range gzip_negotiation http_date basic_auth; do
            mkdir -p "fuzz/corpus/$t"
            # The prebuilt cargo-fuzz is a musl binary and defaults to its
            # own target, where the sanitizer can't run: say gnu.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" \
              "fuzz/corpus/$t" "fuzz/seeds/$t" -- -max_total_time=30
          done

  nginx-tests:
    # The files NGINX_TEST_PROGRESS.md lists as passing, against the
    # nginx-tests commit in scripts/nginx-tests.rev: a PR that breaks one
    # fails here. Bump the commit together with a regenerated progress
    # file.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ruxen-release
          path: target/release
      - name: Perl modules
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libio-socket-ssl-perl libprotocol-websocket-perl
      - name: Fetch nginx-tests
        run: |
          git init -q ../nginx-tests
          git -C ../nginx-tests fetch -q --depth 1 \
            https://github.com/nginx/nginx-tests.git "$(cat scripts/nginx-tests.rev)"
          git -C ../nginx-tests checkout -q FETCH_HEAD
      - name: Run the passing files
        run: |
          chmod +x target/release/ruxen
          scripts/run_nginx_tests.sh --no-build --passing
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-tests-logs
          path: .nginx-tests-out/
          retention-days: 7

  container:
    # contrib/docker: the image builds, and serves under the io_uring
    # seccomp profile it ships with, and under Docker's default profile
    # (epoll, #215).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f contrib/docker/Dockerfile -t ruxen:ci .
      - name: Smoke test
        run: |
          docker run -d --name ruxen -p 8080:8080 \
            --security-opt seccomp=contrib/docker/seccomp-io_uring.json ruxen:ci
          for i in $(seq 50); do curl -sf http://127.0.0.1:8080/ && break; sleep 0.2; done \
            | grep -q "hello from ruxen"
          docker stop ruxen
          test "$(docker inspect ruxen --format '{{.State.ExitCode}}')" = 0
      - name: Smoke test, default seccomp profile
        run: |
          docker run -d --name ruxen-epoll -p 8081:8080 ruxen:ci
          for i in $(seq 50); do curl -sf http://127.0.0.1:8081/ && break; sleep 0.2; done \
            | grep -q "hello from ruxen"
          docker stop ruxen-epoll
          test "$(docker inspect ruxen-epoll --format '{{.State.ExitCode}}')" = 0

  clippy:
    # Pinned: a new clippy brings new lints, which would turn CI red with
    # no code change. Bump the version on purpose, with the fixes it asks
    # for.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    # Keeps `rust-version` in Cargo.toml honest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --locked
