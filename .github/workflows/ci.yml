name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # ruxen is Linux-only and needs io_uring; hosted Ubuntu VMs (not
    # containers) allow it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --release --all-targets --locked
      - name: Test
        run: cargo test --release --locked
