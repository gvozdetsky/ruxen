# HTTP Basic auth bench config — every request walks the htpasswd verify path.
# Uses {SHA} so the per-request cost is a single SHA1 + base64 compare, which
# matches the cheapest realistic htpasswd format. The credential is fixed
# (user="user", password="hello"); wrk sends Authorization: Basic dXNlcjpoZWxsbw==
# Run (from repo root): nginx -p "$PWD/bench/auth_basic/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-auth-error.log  crit;
pid        /tmp/ruxen-bench-auth.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8096 reuseport backlog=4096;
        server_name _;

        auth_basic           "bench";
        auth_basic_user_file htpasswd;

        location / {
            return 200 "hello";
        }
    }
}
