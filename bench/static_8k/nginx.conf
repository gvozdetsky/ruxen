# Static-file bench at 8 KiB body. Pairs with m3 (1 KiB) to spot regressions in
# the larger-write / sendfile path that don't show up at 1 KiB.
# Run (from repo root): nginx -p "$PWD/bench/static_8k/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-static-8k-error.log  crit;
pid        /tmp/ruxen-bench-static-8k.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_requests   1000000;
    keepalive_timeout    75s;

    server {
        listen 8102 reuseport;
        location / {
            root .;
        }
    }
}
