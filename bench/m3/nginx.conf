# M3 bench config — nginx serves the 1 KiB hello.txt from a root tree.
# Run (from repo root): nginx -p "$PWD/bench/m3/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-m3-nginx-error.log  crit;
pid        /tmp/ruxen-m3-nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_requests   1000000;
    keepalive_timeout    75s;

    server {
        listen 8090 reuseport;
        location / {
            root .;
        }
    }
}
