# Minimal nginx config used to baseline ruxen's performance target.
# Serves a fixed 5-byte "hello" body. Matches what ruxen v0.1 will do.
# Run (from repo root): nginx -p "$PWD/bench/m1/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-error.log  crit;
pid        /tmp/ruxen-bench.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8080 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "hello";
        }
    }
}
