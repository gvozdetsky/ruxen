# map + variable rendering bench. Every request runs the User-Agent through a
# `map` block and emits the matched class as the response body. Exercises the
# variable resolver and map dispatch on the hot path.
# Run: nginx -p /tmp -c /home/eugene/ruxen/bench/vars_map/nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-vars-map-error.log  crit;
pid        /tmp/ruxen-bench-vars-map.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    map $http_user_agent $kind {
        default        "other";
        ~*chrome       "chrome";
        ~*firefox      "firefox";
        ~*safari       "safari";
        ~*curl         "curl";
        ~*wrk          "wrk";
    }

    server {
        listen 8100 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 $kind;
        }
    }
}
