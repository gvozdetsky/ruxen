# Reverse-proxy variants: no upstream keep-alive, round robin and least_conn over 4 servers, proxy_set_header with variables, 64 KiB and 1 MiB responses, intercepted errors, client without keep-alive, proxy_redirect, X-Accel-Redirect.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/proxy2/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-proxy2-error.log  crit;
pid        /tmp/ruxen-bench-proxy2.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    proxy_temp_path      /tmp/ruxen-bench-proxy-temp;

    upstream pool_rr {
        server 127.0.0.1:18141;
        server 127.0.0.1:18142;
        server 127.0.0.1:18143;
        server 127.0.0.1:18144;
        keepalive 64;
    }

    upstream pool_lc {
        least_conn;
        server 127.0.0.1:18141;
        server 127.0.0.1:18142;
        server 127.0.0.1:18143;
        server 127.0.0.1:18144;
        keepalive 64;
    }

    upstream files {
        server 127.0.0.1:18150;
        keepalive 64;
    }

    upstream misc {
        server 127.0.0.1:18151;
        keepalive 64;
    }

    server {
        listen 8140 reuseport backlog=4096;
        server_name _;
        location / {
            proxy_pass http://127.0.0.1:18140;
        }
    }

    server {
        listen 8141 reuseport backlog=4096;
        server_name _;
        location / {
            proxy_pass http://pool_rr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8142 reuseport backlog=4096;
        server_name _;
        location / {
            proxy_pass http://pool_lc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8143 reuseport backlog=4096;
        server_name _;
        location / {
            proxy_pass http://pool_rr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Uri $request_uri;
        }
    }

    server {
        listen 8144 reuseport backlog=4096;
        server_name _;
        root html;
        location / {
            proxy_pass http://files;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /intercept {
            proxy_pass http://misc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_intercept_errors on;
            error_page 404 = /fallback;
        }
        location = /fallback {
            return 200 "fallback";
        }
        location = /redirect {
            proxy_pass http://misc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /xar {
            proxy_pass http://misc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /internal/ {
            internal;
        }
    }

    server {
        listen 8147 reuseport backlog=4096;
        server_name _;
        keepalive_timeout 0;
        location / {
            proxy_pass http://pool_rr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 18140 reuseport backlog=4096;
        server_name _;
        return 200 "hello";
    }

    server {
        listen 18141 reuseport backlog=4096;
        server_name _;
        return 200 "hello";
    }

    server {
        listen 18142 reuseport backlog=4096;
        server_name _;
        return 200 "hello";
    }

    server {
        listen 18143 reuseport backlog=4096;
        server_name _;
        return 200 "hello";
    }

    server {
        listen 18144 reuseport backlog=4096;
        server_name _;
        return 200 "hello";
    }

    server {
        listen 18150 reuseport backlog=4096;
        server_name _;
        root html;
    }

    server {
        listen 18151 reuseport backlog=4096;
        server_name _;
        location = /intercept {
            return 404;
        }
        location = /redirect {
            return 302 http://127.0.0.1:18151/next;
        }
        location = /xar {
            add_header X-Accel-Redirect /internal/hello1k.txt;
            return 200 "";
        }
    }
}
