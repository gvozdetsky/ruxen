# nginx config used to baseline ruxen's TLS performance target.
# Mirrors bench/m1/nginx.conf with `listen 8443 ssl;` and TLS 1.3 only.
# Cert/key generated by bench/tls/generate.sh into /tmp/ruxen-bench-tls/.
# Run: nginx -p /tmp -c /home/eugene/ruxen/bench/tls/nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-tls-error.log  crit;
pid        /tmp/ruxen-bench-tls.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    ssl_protocols        TLSv1.3;
    ssl_session_cache    shared:bench:10m;
    ssl_session_tickets  on;

    server {
        listen 8443 ssl reuseport backlog=4096;
        server_name _;

        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;

        location / {
            return 200 "hello";
        }
    }
}
