# Request-processing paths without files: redirects, variables, set/if, split_clients, map regexes, captures, named error pages.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/core2/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-core2-error.log  crit;
pid        /tmp/ruxen-bench-core2.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    map $uri $mapped {
        default none;
        ~^/maprx/k0$ v0;
        ~^/maprx/k1$ v1;
        ~^/maprx/k2$ v2;
        ~^/maprx/k3$ v3;
        ~^/maprx/k4$ v4;
        ~^/maprx/k5$ v5;
        ~^/maprx/k6$ v6;
        ~^/maprx/k7$ v7;
        ~^/maprx/k8$ v8;
        ~^/maprx/k9$ v9;
        ~^/maprx/k10$ v10;
        ~^/maprx/k11$ v11;
        ~^/maprx/k12$ v12;
        ~^/maprx/k13$ v13;
        ~^/maprx/k14$ v14;
        ~^/maprx/k15$ v15;
        ~^/maprx/k16$ v16;
        ~^/maprx/k17$ v17;
        ~^/maprx/k18$ v18;
        ~^/maprx/k19$ v19;
        ~^/maprx/k20$ v20;
        ~^/maprx/k21$ v21;
        ~^/maprx/k22$ v22;
        ~^/maprx/k23$ v23;
        ~^/maprx/k24$ v24;
        ~^/maprx/k25$ v25;
        ~^/maprx/k26$ v26;
        ~^/maprx/k27$ v27;
        ~^/maprx/k28$ v28;
        ~^/maprx/k29$ v29;
        ~^/maprx/k30$ v30;
        ~^/maprx/k31$ v31;
        ~^/maprx/k32$ v32;
        ~^/maprx/k33$ v33;
        ~^/maprx/k34$ v34;
        ~^/maprx/k35$ v35;
        ~^/maprx/k36$ v36;
        ~^/maprx/k37$ v37;
        ~^/maprx/k38$ v38;
        ~^/maprx/k39$ v39;
        ~^/maprx/k40$ v40;
        ~^/maprx/k41$ v41;
        ~^/maprx/k42$ v42;
        ~^/maprx/k43$ v43;
        ~^/maprx/k44$ v44;
        ~^/maprx/k45$ v45;
        ~^/maprx/k46$ v46;
        ~^/maprx/k47$ v47;
        ~^/maprx/k48$ v48;
        ~^/maprx/k49$ v49;
    }

    split_clients "${remote_addr}${request_uri}" $variant {
        50%     a;
        30%     b;
        *       c;
    }

    server {
        listen 8110 reuseport backlog=4096;
        server_name _;

        location = /hello {
            return 200 "hello";
        }
        location = /redirect {
            return 301 https://example.com$request_uri;
        }
        location = /vars {
            return 200 "$remote_addr $request_uri $http_host $server_name $scheme $request_method $uri $args\n";
        }
        location = /args {
            return 200 "$arg_x $arg_y";
        }
        location = /setif {
            set $a "x";
            if ($http_x_test ~* "^yes") {
                set $a "${a}y";
            }
            if ($arg_z != "1") {
                set $a "${a}z";
            }
            return 200 $a;
        }
        location = /split {
            return 200 $variant;
        }
        location /maprx/ {
            return 200 $mapped;
        }
        location = /hdrvars {
            add_header X-Host $host;
            add_header X-Uri $uri;
            add_header X-Method $request_method;
            add_header X-Addr $remote_addr;
            return 200 "hello";
        }
        location /rc/ {
            rewrite ^/rc/(\d+)/(\w+)$ /rct?id=$1&n=$2 last;
        }
        location = /rct {
            return 200 "$arg_id $arg_n";
        }
        location = /errnamed {
            error_page 404 = @fallback;
            return 404;
        }
        location @fallback {
            return 200 "fallback";
        }
    }
}
