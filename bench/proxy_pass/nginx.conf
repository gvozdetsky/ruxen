# Reverse-proxy bench config — frontend on 8095 forwards to a tiny upstream on
# 18095. Both servers run inside the single nginx/ruxen instance, so the bench
# measures the proxy hot path (parse → upstream connect/keepalive → splice back)
# end-to-end without involving a separate origin process.
# Run: nginx -p /tmp -c /home/eugene/ruxen/bench/proxy_pass/nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-proxy-error.log  crit;
pid        /tmp/ruxen-bench-proxy.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    upstream backend {
        server 127.0.0.1:18095;
        keepalive 64;
    }

    server {
        listen 8095 reuseport backlog=4096;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 18095 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "hello";
        }
    }
}
