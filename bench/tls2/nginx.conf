# TLS variants: TLS 1.2, full handshakes per request (1.3, 1.2, RSA 2048), static files and a reverse proxy behind TLS.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/tls2/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-tls2-error.log  crit;
pid        /tmp/ruxen-bench-tls2.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    ssl_session_cache    shared:bench:10m;
    ssl_session_tickets  on;

    upstream plain {
        server 127.0.0.1:18455;
        keepalive 64;
    }

    server {
        listen 8450 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.2;
        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
        location / {
            return 200 "hello";
        }
    }

    server {
        listen 8451 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.3;
        keepalive_timeout 0;
        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
        location / {
            return 200 "hello";
        }
    }

    server {
        listen 8452 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.2;
        keepalive_timeout 0;
        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
        location / {
            return 200 "hello";
        }
    }

    server {
        listen 8453 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.3;
        keepalive_timeout 0;
        ssl_certificate     /tmp/ruxen-bench-tls/rsa-cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/rsa-key.pem;
        location / {
            return 200 "hello";
        }
    }

    server {
        listen 8454 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.3;
        root html;
        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
    }

    server {
        listen 8455 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.3;
        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
        location / {
            proxy_pass http://plain;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 18455 reuseport backlog=4096;
        server_name _;
        return 200 "hello";
    }
}
