# TLS 1.3 static files, as in tls2, with kernel TLS on both servers (#853).
# Run bench/tls_ktls/check.sh before measuring: nginx can silently fall back.
worker_processes auto;
worker_rlimit_nofile 1048576;

error_log /tmp/ruxen-bench-tls-ktls-error.log crit;
pid /tmp/ruxen-bench-tls-ktls.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    default_type text/plain;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000000;
    ssl_session_cache shared:bench:10m;
    ssl_session_tickets on;

    server {
        listen 8460 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols TLSv1.3;
        ssl_conf_command Options KTLS;
        ssl_certificate /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
        root ../tls2/html;
    }
}
