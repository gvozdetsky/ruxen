# Proxy frontends in front of a separate nginx backend (bench/proxy_ext/backend.conf, started once for the whole phase), so both servers under test are measured as proxies only.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/proxy_ext/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-proxy_ext-error.log  crit;
pid        /tmp/ruxen-bench-proxy_ext.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    client_body_temp_path /tmp/ruxen-bench-body-temp;
    proxy_temp_path       /tmp/ruxen-bench-proxy-temp;

    upstream ext {
        server 127.0.0.1:19140;
        keepalive 64;
    }

    upstream extfiles {
        server 127.0.0.1:19141;
        keepalive 64;
    }

    upstream extmisc {
        server 127.0.0.1:19142;
        keepalive 64;
    }

    server {
        listen 8160 reuseport backlog=4096;
        server_name _;
        root html;

        location / {
            proxy_pass http://ext;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /direct {
            proxy_pass http://127.0.0.1:19140;
        }
        location /files/ {
            proxy_pass http://extfiles;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location = /xar {
            proxy_pass http://extmisc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /internal/ {
            internal;
        }
    }
}
