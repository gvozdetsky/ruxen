# M1 config variant with keepalive disabled.
# Run (from repo root): nginx -p "$PWD/bench/m1_no_keepalive/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-m1-no-keepalive-nginx-error.log  crit;
pid        /tmp/ruxen-m1-no-keepalive-nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    0;
    keepalive_requests   1000000;

    server {
        listen 8081 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "hello";
        }
    }
}
