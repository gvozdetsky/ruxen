# M3 static-file variant with keepalive disabled.
# Run: nginx -p /tmp -c /home/eugene/ruxen/bench/m3_no_keepalive/nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-m3-no-keepalive-nginx-error.log  crit;
pid        /tmp/ruxen-m3-no-keepalive-nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_requests   1000000;
    keepalive_timeout    0;

    server {
        listen 8091 reuseport;
        location / {
            root /home/eugene/ruxen/bench/m3;
        }
    }
}
