# Request bodies: POST discarded by a return, and POST forwarded to an upstream with keep-alive (nginx's default 16k client_body_buffer_size; larger bodies go to client_body_temp_path).
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/body/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-body-error.log  crit;
pid        /tmp/ruxen-bench-body.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    client_body_temp_path /tmp/ruxen-bench-body-temp;
    proxy_temp_path       /tmp/ruxen-bench-proxy-temp;
    upstream bodyup {
        server 127.0.0.1:18135;
        keepalive 64;
    }

    server {
        listen 8135 reuseport backlog=4096;
        server_name _;

        location = /sink {
            return 200 "ok";
        }
        location = /proxy {
            proxy_pass http://bodyup;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 18135 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "ok";
        }
    }
}
