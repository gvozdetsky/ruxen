# Proxy cache bench config (#233): 8170 answers from the cache (one key,
# fresh for an hour), 8171 looks the key up on every request but nothing is
# cacheable (no proxy_cache_valid), so each request also goes upstream.
# The upstream on 18170 answers as proxy_hello's does. nginx and ruxen don't share the
# file format: whichever runs second refetches the one key once.
# Run (from repo root): nginx -p "$PWD/bench/proxy_cache/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-proxy-cache-error.log  crit;
pid        /tmp/ruxen-bench-proxy-cache.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    proxy_cache_path     /tmp/ruxen-bench-proxy-cache levels=1:2 keys_zone=bench:10m;

    upstream backend {
        server 127.0.0.1:18170;
        keepalive 64;
    }

    server {
        listen 8170 reuseport backlog=4096;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache bench;
            proxy_cache_valid 200 1h;
        }
    }

    server {
        listen 8171 reuseport backlog=4096;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache bench;
        }
    }

    server {
        listen 18170 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "hello";
        }
    }
}
