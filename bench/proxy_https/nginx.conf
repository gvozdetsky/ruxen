# proxy_https_hello: plain HTTP in, `proxy_pass https://` to a TLS server
# block of the same instance with upstream keep-alive (#116). The TLS
# fixture is bench/tls/generate.sh's (/tmp/ruxen-bench-tls).
worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-proxy-https-error.log  crit;
pid        /tmp/ruxen-bench-proxy-https.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    tcp_nodelay          on;
    keepalive_timeout    65;
    keepalive_requests   1000000;

    upstream backend {
        server 127.0.0.1:18456;
        keepalive 64;
    }

    server {
        listen 8456 reuseport backlog=4096;
        server_name _;
        location / {
            proxy_pass https://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 18456 ssl reuseport backlog=4096;
        server_name _;
        ssl_protocols       TLSv1.3;
        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;
        location / {
            return 200 "hello";
        }
    }
}
