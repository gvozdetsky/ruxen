# Stresses response shaping: 6 add_header directives on top of `return 200`.
# Used to measure header-injection cost vs the bare m1_hello case.
# Run (from repo root): nginx -p "$PWD/bench/add_header_many/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-add-header-error.log  crit;
pid        /tmp/ruxen-bench-add-header.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8101 reuseport backlog=4096;
        server_name _;

        location / {
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header Strict-Transport-Security "max-age=31536000";
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy no-referrer;
            add_header Cache-Control "no-store";
            return 200 "hello";
        }
    }
}
