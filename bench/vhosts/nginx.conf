# Virtual-host selection: 100 exact, 50 wildcard and 20 regex server names on one port.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/vhosts/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-vhosts-error.log  crit;
pid        /tmp/ruxen-bench-vhosts.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8132 reuseport backlog=4096 default_server;
        server_name _;
        return 200 "default";
    }
    server {
        listen 8132;
        server_name h0.example.com;
        return 200 "h0";
    }
