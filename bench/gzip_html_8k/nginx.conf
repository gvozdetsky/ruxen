# gzip filter bench (#93): an 8 KiB HTML page, gzip on at nginx's default
# level 1, every request with Accept-Encoding: gzip.
# Run (from repo root): nginx -p "$PWD/bench/gzip_html_8k/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-gzip-html-8k-error.log  crit;
pid        /tmp/ruxen-bench-gzip-html-8k.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_requests   1000000;
    keepalive_timeout    75s;

    gzip                 on;
    gzip_comp_level      1;

    server {
        listen 8105 reuseport;
        location / {
            root .;
        }
    }
}
