# limit_req in front of a 1 KiB static file (#94): the limit never rejects
# (10M r/s per address), so this measures what checking it costs. Not
# `return`, which answers before limit_req's phase and would skip it.
# Run (from repo root): nginx -p "$PWD/bench/limit_req/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-limit-req-error.log  crit;
pid        /tmp/ruxen-bench-limit-req.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_requests   1000000;
    keepalive_timeout    75s;

    limit_req_zone $binary_remote_addr zone=bench:10m rate=10000000r/s;

    server {
        listen 8106 reuseport;
        location / {
            limit_req zone=bench burst=1000000 nodelay;
            root .;
        }
    }
}
