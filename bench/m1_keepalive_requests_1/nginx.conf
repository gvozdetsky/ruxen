# M1 config variant with keepalive_requests capped to 1.
# Run: nginx -p /tmp -c /home/eugene/ruxen/bench/m1_keepalive_requests_1/nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-m1-ka-req1-nginx-error.log  crit;
pid        /tmp/ruxen-m1-ka-req1-nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1;

    server {
        listen 8082 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "hello";
        }
    }
}
