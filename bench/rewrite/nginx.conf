# Rewrite-engine bench config — every request enters location /foo, runs a
# rewrite to /bar, and is internally re-routed to the /bar location which
# returns 200. Measures the rewrite + internal-redirect hot path vs a plain
# `return 200`.
# Run (from repo root): nginx -p "$PWD/bench/rewrite/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-rewrite-error.log  crit;
pid        /tmp/ruxen-bench-rewrite.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8097 reuseport backlog=4096;
        server_name _;

        location /foo {
            rewrite ^/foo(.*)$ /bar$1 last;
        }

        location /bar {
            return 200 "rewritten";
        }
    }
}
