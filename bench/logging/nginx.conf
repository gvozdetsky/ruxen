# Access logging in the combined format, written to /dev/null (formatting and the write syscall, without filling a disk).
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/logging/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-logging-error.log  crit;
pid        /tmp/ruxen-bench-logging.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8134 reuseport backlog=4096;
        server_name _;
        root html;
        access_log /dev/null combined;

        location = / {
            return 200 "hello";
        }
        location / {
        }
    }
}
