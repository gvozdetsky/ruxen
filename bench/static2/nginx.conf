# Static files: sizes from 0 B to 256 KiB, sendfile off, index, try_files hit and fallback, alias, expires, autoindex.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/static2/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-static2-error.log  crit;
pid        /tmp/ruxen-bench-static2.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8133 reuseport backlog=4096;
        server_name _;
        root html;

        location /nosf/ {
            sendfile off;
        }
        location /spa/ {
            try_files $uri /spa/index.html;
        }
        location /a/ {
            alias html/alias-src/;
        }
        location /exp/ {
            expires 1h;
        }
        location /list/ {
            autoindex on;
        }
    }
}
