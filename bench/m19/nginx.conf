# M19 streaming bench config — nginx serves the same large files.
# Run (from repo root): ./bench/m19/generate.sh && nginx -p "$PWD/bench/m19/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-m19-nginx-error.log  crit;
pid        /tmp/ruxen-m19-nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         application/octet-stream;
    sendfile             off;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_requests   1000000;
    keepalive_timeout    75s;

    server {
        listen 8090 reuseport;
        location / {
            root .;
        }
    }
}
