# HTTP/2 scenarios (#348): h2c with prior knowledge and h2 over TLS 1.3,
# measured with h2load (-m 10 streams per connection). `listen … http2` is
# nginx 1.24's spelling; ruxen takes it too. The TLS certificate comes from
# bench/tls/generate.sh, the 8 KiB file from bench/static_8k.
# Run (from repo root): nginx -p "$PWD/bench/h2/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-h2-error.log  crit;
pid        /tmp/ruxen-bench-h2.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    ssl_protocols        TLSv1.3;
    ssl_session_cache    shared:bench:10m;
    ssl_session_tickets  on;

    server {
        listen 8180 http2 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "hello";
        }

        location = /hello.txt {
            root ../static_8k;
        }
    }

    server {
        listen 8181 ssl http2 reuseport backlog=4096;
        server_name _;

        ssl_certificate     /tmp/ruxen-bench-tls/cert.pem;
        ssl_certificate_key /tmp/ruxen-bench-tls/key.pem;

        location / {
            return 200 "hello";
        }
    }
}
