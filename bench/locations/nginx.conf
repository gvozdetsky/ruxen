# Location matching: 50 regex locations (the request matches the last one) and 200 prefix locations.
# Generated for the 0.1.2 performance campaign; parsed by both nginx and ruxen.
# Run (from repo root): nginx -p "$PWD/bench/locations/" -c nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-locations-error.log  crit;
pid        /tmp/ruxen-bench-locations.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8130 reuseport backlog=4096;
        server_name _;

        location / {
            return 200 "root";
        }
        location ~ ^/re0/ {
            return 200 "re0";
        }
        location ~ ^/re1/ {
            return 200 "re1";
