# Exercises the internal-reroute loop: every request to /missing.txt hits
# try_files which 404s, gets intercepted by `error_page 404 = /fallback`, and
# is internally redirected to the /fallback location which returns 200.
# Run: nginx -p /tmp -c /home/eugene/ruxen/bench/error_page_intercept/nginx.conf

worker_processes  auto;
worker_rlimit_nofile 1048576;

error_log  /tmp/ruxen-bench-error-page-error.log  crit;
pid        /tmp/ruxen-bench-error-page.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    access_log           off;
    default_type         text/plain;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;

    keepalive_timeout    65;
    keepalive_requests   1000000;

    server {
        listen 8104 reuseport backlog=4096;
        server_name _;

        root /home/eugene/ruxen/bench/error_page_intercept;
        error_page 404 = /fallback;

        location /fallback {
            return 200 "fallback";
        }

        location / {
            try_files $uri =404;
        }
    }
}
