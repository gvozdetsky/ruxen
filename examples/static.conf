# Static file server. Point `root` at a directory with your files. MIME
# types come from a built-in extension table, so there is no
# `include mime.types`.
#
#   ruxen -t -c static.conf
#   ruxen -c static.conf
#   curl -I http://127.0.0.1:8080/index.html

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    access_log off;

    server {
        listen 8080;
        server_name _;

        root /var/www/html;

        location / {
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /downloads/ {
            autoindex on;
        }

        location ~* \.(css|js|png|jpg|svg|woff2)$ {
            expires 7d;
        }
    }
}
