# Static file server. Point `root` at a directory with your files. As in
# nginx, Content-Type comes from `types`: `mime.types` next to this file is
# nginx's own (BSD-licensed, nginx 1.24.0); without it every file but
# .html, .gif and .jpg would be `default_type`.
#
#   ruxen -t -c static.conf
#   ruxen -c static.conf
#   curl -I http://127.0.0.1:8080/index.html

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    access_log off;

    server {
        listen 8080;
        server_name _;

        root /var/www/html;

        location / {
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /downloads/ {
            autoindex on;
        }

        location ~* \.(css|js|png|jpg|svg|woff2)$ {
            expires 7d;
        }
    }
}
