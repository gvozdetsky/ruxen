# Smallest useful config: one server answering every request itself.
#
#   ruxen -t -c minimal.conf    # check the config
#   ruxen -c minimal.conf       # run in the foreground (Ctrl-C to stop)
#   curl -i http://127.0.0.1:8080/

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        server_name _;

        location / {
            return 200 "hello from ruxen\n";
        }
    }
}
